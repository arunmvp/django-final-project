{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark Mode UI</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">MyShop</div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/shop/">Shop</a>
        <a href="#">Blog</a>
        <a href="#">Contact</a>
        <a href="/auth/sign_up/">Account</a>
      </div>
      <div class="search-cart">
        <div class="search-box">
          <input type="text" placeholder="Search products..." />
        </div>
        <div style="display: flex">
          {% if user.is_authenticated %} 
          <p style="font-size: small">Welcome, {{ user.username }}! 👋</p>
          {% else %}
          <p>Welcome, Guest!</p>
          {% endif %}
        </div>
        <div class="cart-icon">
          <i class="fas fa-shopping-cart"></i>
        </div>
      </div>
    </nav>

    <!-- Content -->

    {% block products %} {% endblock products %}

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2025 MyDarkShop. All rights reserved.</p>
      <p>Designed by Arun</p>
    </footer>
  </body>
</html>
